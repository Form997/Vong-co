name: "HAI DAT - Kiem thu V2 (Python + 20 ban To)"

on:
  push:
    branches:
      - v2-development
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-thu-du-an:
    name: "Kiem tra Python, 20 ho so va dung luong Git"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lay ma nguon tai commit dang kiem tra
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kiem tra cu phap Python
        run: python -m compileall -q scripts tests

      - name: Chay bo unit test khong can Internet
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Kiem tra 20 bai va so bien ban V2
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path("ban-to")
          dossiers = sorted(p for p in root.glob("[0-9][0-9]-*") if p.is_dir())
          assert len(dossiers) == 20, f"Can 20 thu muc ban To, nhung co {len(dossiers)}"
          numbers = [int(p.name[:2]) for p in dossiers]
          assert numbers == list(range(1, 21)), f"Thieu hoac trung so bai: {numbers}"
          missing = [p.name for p in dossiers if not (p / "README.md").is_file()]
          assert not missing, f"Thieu ho so README: {missing}"
          missing_v2 = [p.name for p in dossiers if not (p / "v2-bien-ban-nghiem-thu.md").is_file()]
          assert not missing_v2, f"Thieu bien ban V2: {missing_v2}"
          readme = Path("README.md").read_text(encoding="utf-8")
          assert "**20/20**" in readme, "README chua ghi ro 20/20 ho so V2"
          assert "**00/20**" in readme or "**0/20**" in readme, "README chua ghi ro 0/20 nghiem thu dien xuong"
          print("PASS: 20/20 ho so, 20/20 bien ban V2, README phan biet nghiem thu.")
          PY

      - name: Kiem tra lien ket noi bo README va tai lieu
        run: python scripts/kiem-tra-lien-ket.py

      - name: Goi API GitHub de thu thong ke dung luong V1-V2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/thong-ke-dung-luong.py --refs v1-frozen v2-development --json
