name: Validate Vong-co MCP

on:
  push:
    branches:
      - feature/mcp-readonly-v1
    paths:
      - "integrations/vong-co-mcp/**"
      - ".github/workflows/vong-co-mcp-tests.yml"
  pull_request:
    paths:
      - "integrations/vong-co-mcp/**"
      - ".github/workflows/vong-co-mcp-tests.yml"

permissions:
  contents: read

jobs:
  offline-and-protocol-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/vong-co-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
